# Unit tests, host smoke test, coverage, and package contents.
#
# Windows runs on Node 22 only: it is the smallest useful cross-platform signal,
# while Ubuntu keeps the Node 20/22 compatibility matrix. Platform-specific
# cases (POSIX permission bits, symbolic links) either inject a seam or skip
# with an explicit reason on Windows.
#
# The real-desktop end-to-end suite (`pnpm test:e2e`) is intentionally not part
# of CI: it spawns an installed DeepSeek Harness desktop app. Run it manually
# (or on a self-hosted runner with the desktop installed) before a release.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: unit tests
        shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: annotate unit failures
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/unit.log"
          if [ ! -f "$log" ]; then exit 0; fi
          grep -aE "✖|not ok|AssertionError|Error:|expected|actual|Uncaught" "$log" | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0
      - run: pnpm test:smoke

  e2e:
    name: real-host e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: install the DSH runtime
        shell: bash
        run: |
          CLI_DIR="$RUNNER_TEMP/dsh-cli"
          mkdir -p "$CLI_DIR"
          cd "$CLI_DIR"
          printf '{"name":"dsh-e2e-runtime","private":true}\n' > package.json
          pnpm add @deepseek-ai/dsh@0.2.2-rc.1
      - name: verify the installed dsh runtime
        shell: bash
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: test -f "$DSH_E2E_DSH_BIN"
      - name: e2e against the npm-installed dsh web host
        shell: bash
        env:
          DSH_E2E_DSH_BIN: ${{ runner.temp }}/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: pnpm test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: verify the e2e suite actually ran
        if: success()
        shell: bash
        run: grep -q "e2e-web regression passed" "$RUNNER_TEMP/e2e.log"
      - name: annotate e2e failures
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/e2e.log"
          if [ ! -f "$log" ]; then exit 0; fi
          grep -aE "e2e-web regression failed|AssertionError|Error:|spawn error|dsh web:" "$log" | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0

  coverage:
    name: coverage (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: coverage over lib (thresholds)
        run: >-
          node test/run-unit.mjs --experimental-test-coverage
          --test-coverage-include="lib/**"
          --test-coverage-lines=85
          --test-coverage-branches=70
          --test-coverage-functions=84

  pack:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pack --dry-run
